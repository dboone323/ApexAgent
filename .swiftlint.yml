included:
  - ApexAgent
  - ApexAgentRuntime
  - ApexAgentIntents
  - ApexAgentTests
  - Tools

excluded:
  - .build
  - build
  - ApexAgent.xcodeproj
  - Modules

only_rules:
  - compiler_protocol_init
  - duplicate_imports
  - empty_enum_arguments
  - fatal_error_message
  - leading_whitespace
  - legacy_cggeometry_functions
