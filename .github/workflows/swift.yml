name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode 27)
    runs-on: macos27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        # shared-kit is an LFS-backed repo; the dependency fetch fails without it.
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            brew install git-lfs || true
          fi
          git lfs install

      - name: Select Xcode 27
        run: sudo xcode-select -s /Applications/Xcode_27.app || true

      - name: Toolchain info
        run: xcodebuild -version && swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run Test Plan & Generate xcresult
        run: |
          mkdir -p build
          xcodebuild test -project ApexAgent.xcodeproj -scheme ApexAgent \
            -testPlan ApexAgent-UnitTests \
            -destination "platform=macOS" \
            -resultBundlePath build/CI-UnitTests.xcresult

      - name: Generate Diagnostic Summary & Step Summary
        if: always()
        run: |
          chmod +x ./Tools/scripts/xcresult-report.sh
          ./Tools/scripts/xcresult-report.sh build/CI-UnitTests.xcresult

      - name: Upload xcresult Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-UnitTests.xcresult
          path: build/CI-UnitTests.xcresult
          retention-days: 7
