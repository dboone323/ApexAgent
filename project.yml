name: ApexAgent
options:
  bundleIdPrefix: com.apexagent
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

packages:
  Containerization:
    url: https://github.com/apple/containerization
    exactVersion: 0.38.0
  swift-log:
    url: https://github.com/apple/swift-log
    exactVersion: 1.14.0

settings:
  base:
    SWIFT_VERSION: 6.4
    MACOSX_DEPLOYMENT_TARGET: 27.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    DYLIB_INSTALL_NAME_BASE: "@rpath"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_SWIFT_FLAGS: "$(inherited)"
    # Local dev builds: ad-hoc sign (no paid cert) so entitlements actually
    # embed. CODE_SIGNING_ALLOWED:NO produced a linker-signed binary with ZERO
    # entitlements — Virtualization.framework then refuses to create VMs, so
    # the Apple Container sandbox could never start. Ad-hoc identity "-" signs
    # locally and embeds ApexAgent.entitlements.
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    # FoundationModels is weak-linked so the app launches on builds that lack
    # the symbols (AgentEngine.swift dlsym-checks availability).
    OTHER_LDFLAGS: "-weak_framework FoundationModels -weak_framework _FoundationModels_AppKit -weak_framework _FoundationModels_SwiftUI -weak_framework _Vision_FoundationModels -weak_framework _CoreSpotlight_FoundationModels"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  # ── Inlined shared-kit modules (frameworks) ──
  SharedLogging:
    type: framework
    platform: macOS
    sources:
      - path: Modules/SharedLogging
    settings:
      base:
        PRODUCT_NAME: SharedLogging
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.SharedLogging
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  SharedModels:
    type: framework
    platform: macOS
    sources:
      - path: Modules/SharedModels
    settings:
      base:
        PRODUCT_NAME: SharedModels
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.SharedModels
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: SharedLogging

  SharedKit:
    type: framework
    platform: macOS
    sources:
      - path: Modules/SharedKit
    dependencies:
      - target: SharedModels
      - target: SharedLogging
    settings:
      base:
        PRODUCT_NAME: SharedKit
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.SharedKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  MCPKit:
    type: framework
    platform: macOS
    sources:
      - path: Modules/MCPKit
    dependencies:
      - target: SharedLogging
    settings:
      base:
        PRODUCT_NAME: MCPKit
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.MCPKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # ── Core app logic (the framework, now includes @main app entry) ──
  ApexAgentCore:
    type: framework
    platform: macOS
    sources:
      - path: ApexAgent
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    resources:
      - path: ApexAgent/Resources
        optional: true
    dependencies:
      - target: SharedKit
      - target: MCPKit
      - package: swift-log
        product: Logging
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationOCI
      # ContainerManager.swift imports these (mirrors Package.swift).
      - package: Containerization
        product: ContainerizationArchive
      - package: Containerization
        product: ContainerizationOS
    settings:
      base:
        PRODUCT_NAME: ApexAgentCore
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  # ── Application executable ──
  ApexAgent:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: ApexAgentRuntime
    resources:
      - path: ApexAgent/Resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: ApexAgent
        PRODUCT_MODULE_NAME: ApexAgent
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgent
        INFOPLIST_FILE: ApexAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: ApexAgent/ApexAgent.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        ENABLE_PREVIEWS: YES
    dependencies:
      # Local frameworks are linked + embedded by the app.
      - target: ApexAgentCore
      - target: ApexAgentIntents
      - target: SharedKit
      - target: SharedModels
      - target: SharedLogging
      - target: MCPKit
    scheme:
      gatherCoverageData: true
      testTargets:
        - ApexAgentTests
        - ApexAgentIntelligenceTests
        - ApexAgentContainerTests
        - ApexAgentUITests
      environmentVariables:
        APEX_DEBUG: "1"

  # ── App Intents framework (Siri / Shortcuts integration) ──
  ApexAgentIntents:
    type: framework
    platform: macOS
    sources:
      - path: ApexAgentIntents
    settings:
      base:
        PRODUCT_NAME: ApexAgentIntents
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentIntents
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_LDFLAGS: "-framework AppIntents"
    dependencies:
      - target: ApexAgentCore
  sandboxctl:
    type: com.apple.product-type.tool
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tools/sandboxctl
    settings:
      base:
        PRODUCT_NAME: sandboxctl
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.sandboxctl
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ApexAgent/ApexAgent.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - target: ApexAgentCore
      - package: Containerization
        product: Containerization
      - package: Containerization
        product: ContainerizationOCI

  apexflow:
    type: com.apple.product-type.tool
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tools/apexflow
    settings:
      base:
        PRODUCT_NAME: apexflow
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.apexflow
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ApexAgent/ApexAgent.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - target: ApexAgentCore

  benchmark-repro:
    type: com.apple.product-type.tool
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tools/benchmark-repro
    settings:
      base:
        PRODUCT_NAME: benchmark-repro
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.benchmark-repro
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ApexAgent/ApexAgent.entitlements
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks

  # ── Tests ──
  ApexAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ApexAgentTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ApexAgentTests
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentTests
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) $(BUILD_DIR)/Products/Debug
    dependencies:
      - target: ApexAgentCore
      - target: MCPKit
      - package: swift-log
        product: Logging

  ApexAgentIntelligenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ApexAgentIntelligenceTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ApexAgentIntelligenceTests
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentIntelligenceTests
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) $(BUILD_DIR)/Products/Debug
    dependencies:
      - target: ApexAgentCore

  ApexAgentContainerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ApexAgentContainerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ApexAgentContainerTests
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentContainerTests
        ENABLE_TESTABILITY: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) $(BUILD_DIR)/Products/Debug
    dependencies:
      - target: ApexAgentCore
      # NOTE: do NOT link Containerization products here directly. The tests only
      # use `@testable import ApexAgentCore` (which already links them). Linking
      # the same dynamic SPM products from two targets makes `xcodebuild test`
      # emit duplicate build commands for PackageFrameworks/Crypto.framework
      # ("Multiple commands produce ... Crypto.framework").

  ApexAgentUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ApexAgentUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ApexAgentUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.apexagent.ApexAgentUITests
        TEST_TARGET_NAME: ApexAgent
    dependencies:
      - target: ApexAgent

schemes:
  ApexAgent:
    build:
      targets:
        ApexAgent: all
        ApexAgentTests: [test]
        ApexAgentIntelligenceTests: [test]
        ApexAgentContainerTests: [test]
        ApexAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ApexAgentTests
        - ApexAgentIntelligenceTests
        - ApexAgentContainerTests
        - ApexAgentUITests
    archive:
      config: Release
